services:
  - type: web
    name: karnataka-travel-diaries
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
